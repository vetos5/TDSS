[project]
name = "tdss"
version = "5.0.0-dev"
description = "Transport Interchange Decision Support System — Vue 3 + FastAPI + multi-method MCDA engine"
authors = [{ name = "Vitalii Kovtun" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "shapely>=2.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
# Only needed by the deprecated Streamlit UIs (app/ui, legacy/streamlit_ui).
legacy = ["streamlit>=1.31", "streamlit-shadcn-ui>=0.1", "plotly>=5.18", "pydeck>=0.9", "pandas>=2.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "app/ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Long bilingual expert-description strings.
"app/data/interchange_data.py" = ["E501"]
"app/data/mcda_methods.py" = ["E501"]
