# Local Docker run: `docker compose up --build`, then http://localhost. For a server, use
# docker-compose.zima.yml (README). Settings such as TDSS_ADMIN_TOKEN can go in a .env file here.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Bearer token for corpus uploads, deletes and retrains; without it the site is read-only.
      TDSS_ADMIN_TOKEN: ${TDSS_ADMIN_TOKEN:-}
    expose:
      - "8000"
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    # Only docker-entrypoint.sh uses these, as root, before it drops to an unprivileged user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    ports:
      # Loopback only; TDSS_BIND=0.0.0.0 opens it to the network.
      - "${TDSS_BIND:-127.0.0.1}:80:80"
    depends_on:
      - backend
    logging: *logging
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
