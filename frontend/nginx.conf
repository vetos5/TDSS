# TDSS front end: serves the built SPA and proxies /api and /blueprints to the backend.
# The image installs this file as conf.d/default.conf, inside nginx's http block, so the zones and
# the map below are http-level. Everything else is set in the server block.

# The limits are per client: the real address (see set_real_ip_from below), and for IPv6 its /64
# prefix, since one IPv6 client can rotate through the whole /64 to get a fresh bucket each time.
# An address written with :: inside its first four groups is keyed on the part before the ::, which
# is coarser (several /64s may share a bucket) but just as stable.
map $remote_addr $tdss_client {
    "~*^(?<p>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"  $p;
    "~*^(?<p>[0-9a-f:]*)::"                                              $p;
    default                                                              $binary_remote_addr;
}

# Excess requests get a 429. A page load makes about 15 API and blueprint requests. The costly
# endpoints (SMAA robustness, GIS site analysis, the admin-token check) get a much lower rate. The
# corpus edits have their own zone: they need the token anyway, and an admin uploading a batch of
# documents must not run out of the analysis allowance (or the other way round).
limit_req_zone  $tdss_client zone=tdss_api:10m   rate=10r/s;
limit_req_zone  $tdss_client zone=tdss_heavy:10m rate=12r/m;
limit_req_zone  $tdss_client zone=tdss_admin:10m rate=60r/m;
limit_conn_zone $tdss_client zone=tdss_conn:10m;

# Vite puts a content hash in every asset name, so /assets/ can be cached for good. index.html
# (and the other root files) must not be cached, or a redeploy keeps serving the old asset
# names. The backend sets its own caching. Kept in a map so that no location needs an add_header.
map $uri $tdss_cache_control {
    ~^/assets/            "public, immutable";
    ~^/(api|blueprints)/  "";
    default               "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The real client address. In production the Cloudflare tunnel (cloudflared on the host)
    # connects to the port published on 127.0.0.1, and Docker hands that connection to nginx from
    # the network's gateway. Only the gateway may set the client address with CF-Connecting-IP;
    # the header is ignored from anyone else. 172.16.58.1 is the gateway of the subnet pinned in
    # docker-compose.zima.yml: change both together.
    set_real_ip_from 172.16.58.1;
    real_ip_header   CF-Connecting-IP;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn tdss_conn 20;

    # JSON request bodies are about 1 KB. Only the corpus upload (below) is allowed more.
    client_max_body_size 32k;

    # Short timeouts, so that slow or stalled clients cannot hold connections open (slowloris).
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    reset_timedout_connection on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Every add_header lives here, at server level, and no location has one of its own: nginx
    # drops all inherited add_header lines in a location that defines any. `always` puts the
    # security headers on error responses too.
    add_header Cache-Control $tdss_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # The full policy only reports (in the browser's DevTools console) until it has been checked
    # in a browser; then it can replace the enforcing header above. The sha256 is the hash of the
    # inline theme script in index.html. Recompute it whenever that script changes at all:
    #   python3 -c "import re,hashlib,base64; s=open('frontend/index.html').read(); b=re.search(r'<script>(.*?)</script>',s,re.S).group(1); print(base64.b64encode(hashlib.sha256(b.encode()).digest()).decode())"
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-zB3DlwDLnnSlImdiaMXPE5m6fDW4OjTsVsXb10gT8C8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' https://overpass-api.de https://overpass.private.coffee; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Inherited by every proxied location below (none sets its own). X-Forwarded-For is
    # overwritten, not appended to, so a client cannot put addresses of its own in it.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Site analysis waits on Overpass and the elevation API, with retries.
    proxy_read_timeout 120s;

    # proxy_pass without a path passes the request URI on unchanged.
    location /api/ {
        limit_req zone=tdss_api burst=20 nodelay;
        proxy_pass http://backend:8000;
    }

    # The costly endpoints (SMAA robustness, GIS site analysis) and the admin-token check, so that
    # guessing a token is slow. A regex location wins over the /api/ prefix. Without a trailing $
    # it also catches variants such as /api/robustness/.
    location ~ ^/api/(robustness|site/|model/auth) {
        limit_req zone=tdss_heavy burst=10 nodelay;
        # Site requests may carry the map data the browser fetched itself when the server could
        # not reach Overpass (`osm`): up to 200,000 nodes, about 5 MB of JSON.
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
    }

    # Retrains and corpus deletes (admin token).
    location ~ ^/api/model/(retrain|documents/) {
        limit_req zone=tdss_admin burst=30 nodelay;
        proxy_pass http://backend:8000;
    }

    # Corpus uploads: the backend accepts up to 5 MB, plus room for the multipart envelope. A
    # request without any token is turned away here, before its body is read and passed on.
    location = /api/model/documents {
        client_max_body_size 6m;
        limit_req zone=tdss_admin burst=30 nodelay;
        if ($http_authorization = "") {
            return 401;
        }
        proxy_pass http://backend:8000;
    }

    location /blueprints/ {
        limit_req zone=tdss_api burst=20 nodelay;
        proxy_pass http://backend:8000;
        expires 1d;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
