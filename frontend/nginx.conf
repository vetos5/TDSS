server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Corpus uploads are limited to 5 MB by the backend; leave room for the multipart envelope.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Site analysis waits on Overpass and the elevation API, with retries.
        proxy_read_timeout 120s;
    }

    location /blueprints/ {
        proxy_pass http://backend:8000/blueprints/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        expires 1d;
    }

    # Vite puts a content hash in every asset name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, or a redeploy keeps serving the old asset names.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
